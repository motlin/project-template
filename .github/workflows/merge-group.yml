# Language-agnostic merge group jobs.
# Derived templates should extend this with language-specific check jobs
# (e.g., lint, typecheck, test, build).

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Run pre-commit hooks to verify basic hygiene; mise provides the
  # system-language hook tools (pre-commit, vp, markdownlint-cli2)
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pre-commit run --all-files

  # Lint markdown files
  reviewdog-markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: reviewdog/action-markdownlint@v0.26.2
        with:
          reporter: github-pr-check
          fail_on_error: true
          filter_mode: nofilter

  # Lint YAML files
  reviewdog-yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: reviewdog/action-yamllint@v1.21.0
        with:
          reporter: github-pr-check
          fail_on_error: true
          filter_mode: nofilter

  # Lint GitHub Actions workflow files
  reviewdog-actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: reviewdog/action-actionlint@v1.72.0
        with:
          reporter: github-pr-check
          fail_on_error: true
          filter_mode: nofilter

  # Gate job that requires all checks to pass
  # Derived templates should add their language-specific jobs to the 'needs' array
  all-checks:
    name: All checks
    if: always()
    needs: [pre-commit, reviewdog-markdownlint, reviewdog-yamllint, reviewdog-actionlint]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
